<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/main.js" defer></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>

  <form>
    <p>Customer Name</p>
    
    <label for="fname">First Name</label>
      <br>
      <input type="text" id="first-name" name="first-name" required />
    <br>
    <label for="fname">Last Name</label>
      <br>
      <input type="text" id="last-name" name="last-name" required />
    <br>

    <p>Address</p>
    <label for="address">Street Address</label>
      <br>
      <input type="text" id="address" name="address" required />
    <br>
    <label for="city">City</label>
      <br>
      <input type="text" id="city" name="city" required />
    <br>
    <label for="state">State</label>
      <br>
      <input type="text" id="state" name="state" required />
    <br>
    <label for="zip">Zip Code</label>
      <br>
      <input type="text" id="zip" name="zip" required />
    <br>

    <p>Payment</p>
    <label for="card-number">Credit Card Card Number</label>
      <br>
      <input type="text" id="card-number" name="card-number" placeholder="XXXX-XXXX-XXXX" required />
    <br>
    <label for="expiration-date">Expiration Date</label>
      <br>
      <input type="text" id="expiration-date" name="expiration-date" placeholder="MM/YY" required />
    <br>
    <label for="cvv">CVV</label>
      <br>
      <input type="text" id="cvv" name="cvv" placeholder="CVV" required />
    <br>
  
    <button type="sub mit">Place Order</button>
    <br>
 
  </form>

  <div id="order-summary">
    <h3>Order Summary</h3>
    <p id="subtotal">Subtotal: </p>
    <p id="tax">Tax: </p>
    <p id="shipping-estate">Shipping Estate: </p>
    <p id="order-total">Order Total: </p>
  </div>
  <br>
  <button type="checkout">Checkout</button>
</html>
