<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/main.js" defer></script>
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <section class="form-checkout">
        <div class="summary">
          <h3>Summary</h3>
          <form name="checkout" action="">
            <fieldset>
              <legend>Customer Name</legend>
              <label for="fname">First Name</label>
              <input required type="text" name="fname" id="fname" />
              <label for="lname">Last Name</label>
              <input required type="text" name="lname" id="lname" />
            </fieldset>
            <fieldset>
              <legend>Address</legend>
              <label for="street">Street Address</label>
              <input required type="text" name="street" id="street" />
              <label for="city">City</label>
              <input required type="text" name="city" id="city" />
              <label for="state">State</label>
              <input required type="text" name="state" id="state" />
              <label for="zip">Zip Code</label>
              <input required type="text" name="zip" id="zip" />
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <label for="cardNumber">Credit Card Number</label>
              <input required type="text" name="cardNumber" id="cardNumber" />
              <label for="expiration">Expiration Date</label>
              <input required type="text" name="expiration" id="expiration" />
              <label for="code">Security Code</label>
              <input required type="number" name="code" id="code" />
            </fieldset>

          <table>
            <tr>
              <td>Subtotal: $<span id="subtotal"></span></td>
            </tr>
            <tr>
              <td>Shipping Estimate: $<span id="shipping"></span></td>
            </tr>
            <tr>
              <td>Tax: $<span id="tax"></span></td>
            </tr>
            <tr>
              <td>Order Total: $<span id="order-total"></span></td>
            </tr>
          </table>
        </div>
        

          <button id="paySubmit" type="submit">Pay</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
